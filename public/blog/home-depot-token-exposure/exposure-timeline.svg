  <circle cx="40" cy="72" r="4"/>
  <circle cx="250" cy="72" r="4"/>
  <circle cx="430" cy="72" r="4"/>
  <circle cx="600" cy="72" r="4"/>

  <g font-size="11" letter-spacing=".04em" opacity=".4" style="text-transform:uppercase">
